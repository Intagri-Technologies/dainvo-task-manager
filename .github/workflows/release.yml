name: Release

on:
  push:
    tags:
      - '*'

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/validate-release-version.mjs "${{ github.ref_name }}"
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm verify:production-build
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - uses: softprops/action-gh-release@v2
        with:
          name: Dainvo Task Manager ${{ github.ref_name }}
          body: |
            Dainvo Task Manager ${{ github.ref_name }}

            - Syncs task projections directly to Dainvo mobile from Obsidian desktop and mobile.
            - Keeps the local Dainvo desktop bridge independently available on desktop.
            - Supports stable IDs plus mobile complete/reopen/delete write-back without uploading Markdown bodies or vault files.
          files: |
            main.js
            manifest.json
            styles.css
